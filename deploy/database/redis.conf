# SONiC APPL_DB / ASIC_DB share one Redis (DB 0 / DB 1), matching
# sonic-buildimage database_config.json ids.
bind 0.0.0.0
port 6379
protected-mode no
daemonize no
# Keyspace events so dashorch can subscribe to DASH_* HSET.
notify-keyspace-events KEA
save ""
appendonly no
